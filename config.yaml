# required configuration options
name: Hearth (Will's fork)
version: 0.1.20
slug: ha_hearth
description: An independent Home Assistant dashboard for wall tablets, phones and desktops
arch:
  - aarch64
  - amd64

# disable the docker default system init
init: false

# homepage of the add-on
url: https://github.com/willadamskeane/addon-ha-hearth

# icon for the menu panel integration
panel_icon: mdi:fireplace

# allow non-administration users
panel_admin: false

# security profile
apparmor: true

# ingress feature for the add-on
ingress: true
ingress_stream: true

# enable api to get host port
hassio_api: true

# allow the server-side direct kiosk bridge to use the Core API proxy
homeassistant_api: true

# port to expose, null defaults to disabled
ports:
  8099/tcp: null

# published by .github/workflows/publish.yml
image: ghcr.io/willadamskeane/addon-ha-hearth-{arch}

options:
  direct_access: false
  trusted_clients: []
  low_power: false
schema:
  direct_access: bool
  trusted_clients:
    - str
  low_power: bool
